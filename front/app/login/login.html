<div class="login-container">
  <div class="login-header">
    <h1>CERISoNet</h1>
    <p>Connectez-vous pour rejoindre la communauté</p>
  </div>
  <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
          <label>Identifiant / Email</label>
          <input type="text" name="login" [ngModel]="loginUser()" (ngModelChange)="loginUser.set($event)" placeholder="votre@email.com" required>
      </div>
      <div class="form-group">
          <label>Mot de passe</label>
          <input type="password" name="password" [ngModel]="passwordUser()" (ngModelChange)="passwordUser.set($event)" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;" [disabled]="!loginForm.form.valid">Se connecter</button>
  </form>
</div>
